<script>document.write("\u003c\u0021\u0044\u004f\u0043\u0054\u0059\u0050\u0045\u0020\u0068\u0074\u006d\u006c\u003e\u000a\u003c\u0068\u0074\u006d\u006c\u0020\u006c\u0061\u006e\u0067\u003d\u0022\u0065\u006e\u0022\u003e\u003c\u0068\u0065\u0061\u0064\u003e\u003c\u006d\u0065\u0074\u0061\u0020\u0063\u0068\u0061\u0072\u0073\u0065\u0074\u003d\u0022\u0075\u0074\u0066\u002d\u0038\u0022\u003e\u003c\u0074\u0069\u0074\u006c\u0065\u003e\u004f\u006d\u0065\u0067\u006c\u0065\u0052\u0065\u0072\u0075\u006e\u0020\u002d\u0020\u0054\u0061\u006c\u006b\u0020\u0074\u006f\u0020\u0073\u0074\u0072\u0061\u006e\u0067\u0065\u0072\u0073\u0021\u003c\u002f\u0074\u0069\u0074\u006c\u0065\u003e\u000a\u003c\u006d\u0065\u0074\u0061\u0020\u006e\u0061\u006d\u0065\u003d\u0022\u0076\u0069\u0065\u0077\u0070\u006f\u0072\u0074\u0022\u0020\u0063\u006f\u006e\u0074\u0065\u006e\u0074\u003d\u0022\u0077\u0069\u0064\u0074\u0068\u003d\u0064\u0065\u0076\u0069\u0063\u0065\u002d\u0077\u0069\u0064\u0074\u0068\u002c\u0020\u0069\u006e\u0069\u0074\u0069\u0061\u006c\u002d\u0073\u0063\u0061\u006c\u0065\u003d\u0031\u002c\u0020\u0076\u0069\u0065\u0077\u0070\u006f\u0072\u0074\u002d\u0066\u0069\u0074\u003d\u0063\u006f\u0076\u0065\u0072\u0022\u003e\u000a\u003c\u0073\u0074\u0079\u006c\u0065\u003e\u000a\u003a\u0072\u006f\u006f\u0074\u007b\u002d\u002d\u0062\u0067\u003a\u0023\u0030\u0064\u0030\u0066\u0031\u0032\u003b\u002d\u002d\u0070\u0061\u006e\u0065\u006c\u003a\u0023\u0031\u0036\u0031\u0039\u0031\u0065\u003b\u002d\u002d\u0070\u0061\u006e\u0065\u006c\u0032\u003a\u0023\u0031\u0065\u0032\u0032\u0032\u0038\u003b\u002d\u002d\u006c\u0069\u006e\u0065\u003a\u0023\u0032\u0061\u0032\u0066\u0033\u0037\u003b\u002d\u002d\u0074\u0065\u0078\u0074\u003a\u0023\u0065\u0063\u0065\u0065\u0066\u0031\u003b\u002d\u002d\u006d\u0075\u0074\u0065\u003a\u0023\u0038\u0061\u0039\u0031\u0039\u0062\u003b\u002d\u002d\u006f\u0072\u003a\u0023\u0066\u0066\u0037\u0061\u0031\u0061\u003b\u002d\u002d\u006f\u0072\u0032\u003a\u0063\u006f\u006c\u006f\u0072\u002d\u006d\u0069\u
